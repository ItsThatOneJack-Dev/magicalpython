[project]
name = "magicalpython"
authors = [{ name = "ItsThatOneJack", email = "jack@itoj.dev" }]
dynamic = ["version"]
description = "Python but there is assembly, Pointers, memory allocation and protection, Result types, and more! Because I only ask \"why not?\" sometimes, rather than \"why?\"."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.8"
dependencies = ["colorama>=0.4.6", "keystone-engine>=0.9.2"]
keywords = ["assembly", "ctypes", "pointers", "memory", "esoteric"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/ItsThatOneJack-Dev/magicalpython"
Repository = "https://github.com/ItsThatOneJack-Dev/magicalpython.git"
Issues = "https://github.com/ItsThatOneJack-Dev/magicalpython/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/magicalpython/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/magicalpython"]
artifacts = ["*.dll", "*.so"]
